name: spike
on: workflow_dispatch
jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [Edge, Core]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install octopus
        run: |
          s=$(date +%s)
          pip install "octopus[logos] @ git+https://github.com/logos-messaging/octopus@main"
          echo "SPIKE pip_install_s=$(( $(date +%s) - s ))"
      - name: install the library
        run: |
          s=$(date +%s)
          octopus lib install
          echo "SPIKE lib_install_s=$(( $(date +%s) - s ))"
      - name: spike
        env:
          SPIKE_MODE: ${{ matrix.mode }}
        run: python spike_client.py
