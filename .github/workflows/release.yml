name: Release

# Publishes a GitHub release for a version tag: the Python wheel and sdist, and the prebuilt
# liblogosdelivery for Linux x86_64 and macOS arm64, with SHA256SUMS. The tag must already exist and
# match the version in pyproject.toml. Push a `v*` tag, or run this by hand for an existing tag
# (the workflow file is taken from the branch you run it on, so use main for tags that predate it).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.3.0"
        type: string
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  libs:
    name: libs
    # release-lib's publish job asks for contents: write even when it is skipped.
    permissions:
      contents: write
    uses: ./.github/workflows/release-lib.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}
      publish: false

  dist:
    name: wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The tag matches the version in the code
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "v$version" ]; then
            echo "error: tag $TAG does not match pyproject.toml version $version" >&2
            exit 1
          fi

      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  release:
    name: publish the release
    needs: [libs, dist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Checksums
        working-directory: assets
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber
          else
            gh release create "$TAG" assets/* --verify-tag --title "Octopus $TAG" --generate-notes
          fi
