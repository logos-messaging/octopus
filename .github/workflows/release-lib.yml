name: Release liblogosdelivery

# Builds liblogosdelivery from the logos-delivery commit pinned by the bindings and, when asked,
# publishes it to the `lib-latest` release for `octopus lib install`. Nothing is published unless
# you run this by hand with `publish` ticked.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload the libraries to the lib-latest release"
        type: boolean
        default: false
  # release.yml builds the same libraries for a version release, without publishing them here.
  workflow_call:
    inputs:
      ref:
        description: "Tag or commit to build (default: the caller's)"
        type: string
        default: ""
      publish:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, asset: liblogosdelivery-linux-x86_64.so, built: liblogosdelivery.so }
          - { os: macos-15, asset: liblogosdelivery-macos-arm64.dylib, built: liblogosdelivery.dylib }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: true

      # The same build as CI and the E2E test (flags, cache), so what is published is what the
      # needs_lib tests ran against.
      - uses: ./.github/actions/liblogosdelivery

      # The build keeps its debug information: 279 MB on Linux, 68 MB without it. The exported
      # symbols stay.
      - name: Strip the debug information
        run: |
          lib="vendor/logos-delivery-python-bindings/vendor/logos-delivery/build/${{ matrix.built }}"
          if [ "$RUNNER_OS" = "macOS" ]; then strip -S "$lib"; else strip --strip-debug "$lib"; fi
          ls -l "$lib"

      # `octopus lib install` takes the .gz when it is listed in SHA256SUMS. The plain asset stays
      # for installs of older versions, which only know that name.
      - name: Name the asset
        run: |
          cp "vendor/logos-delivery-python-bindings/vendor/logos-delivery/build/${{ matrix.built }}" "${{ matrix.asset }}"
          gzip -9 -c "${{ matrix.asset }}" > "${{ matrix.asset }}.gz"
          ls -l "${{ matrix.asset }}" "${{ matrix.asset }}.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.gz
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Checksums
        working-directory: assets
        run: sha256sum liblogosdelivery-* > SHA256SUMS && cat SHA256SUMS

      - name: Publish the lib-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view lib-latest >/dev/null 2>&1 || gh release create lib-latest \
            --prerelease --title "liblogosdelivery" \
            --notes "Prebuilt liblogosdelivery for \`octopus lib install\`. Built from the logos-delivery commit pinned by the bindings; see SHA256SUMS."
          gh release upload lib-latest assets/* --clobber
