name: Release liblogosdelivery

# Builds liblogosdelivery from the logos-delivery commit pinned by the bindings and, when asked,
# publishes it to the `lib-latest` release for `octopus lib install`, with a signed build provenance
# attestation. Nothing is published unless you run this by hand with `publish` ticked.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload the libraries to the lib-latest release"
        type: boolean
        default: false
  # release.yml builds the same libraries for a version release, without publishing them here.
  workflow_call:
    inputs:
      ref:
        description: "Tag or commit to build (default: the caller's)"
        type: string
        default: ""
      publish:
        type: boolean
        default: false
      attest:
        description: "Sign build provenance for the libraries (the caller publishes them)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # One commit for both builds and the attestation, whatever the ref does meanwhile.
  resolve:
    name: resolve
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.os }})
    needs: resolve
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, asset: liblogosdelivery-linux-x86_64.so, built: liblogosdelivery.so }
          - { os: macos-15, asset: liblogosdelivery-macos-arm64.dylib, built: liblogosdelivery.dylib }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          submodules: true

      # The same build as CI and the E2E test (flags), so what is published is what the needs_lib
      # tests ran against. From source: a cached library could come from any run on this ref.
      - uses: ./.github/actions/liblogosdelivery
        with:
          cache: "false"

      # The build keeps its debug information: 279 MB on Linux, 68 MB without it. The exported
      # symbols stay.
      - name: Strip the debug information
        run: |
          lib="vendor/logos-delivery-python-bindings/vendor/logos-delivery/build/${{ matrix.built }}"
          if [ "$RUNNER_OS" = "macOS" ]; then strip -S "$lib"; else strip --strip-debug "$lib"; fi
          ls -l "$lib"

      # `octopus lib install` takes the .gz when it is listed in SHA256SUMS. The plain asset stays
      # for installs of older versions, which only know that name.
      - name: Name the asset
        run: |
          cp "vendor/logos-delivery-python-bindings/vendor/logos-delivery/build/${{ matrix.built }}" "${{ matrix.asset }}"
          gzip -9 -c "${{ matrix.asset }}" > "${{ matrix.asset }}.gz"
          ls -l "${{ matrix.asset }}" "${{ matrix.asset }}.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.gz
          if-no-files-found: error

  # Signed build provenance for the libraries that get published, so a file swapped into the
  # release fails `gh attestation verify`. Its own job: the build job never gets id-token.
  attest:
    name: attest
    needs: [resolve, build]
    if: inputs.publish || inputs.attest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # The certificate names this run's ref and commit, not inputs.ref: sign only what they built.
      # A tag push always builds its own commit; a run of release.yml by hand may not.
      - name: The build is this run's commit
        id: own
        env:
          BUILT: ${{ needs.resolve.outputs.commit }}
        run: |
          if [ "$BUILT" = "$GITHUB_SHA" ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "::error::built $BUILT, but this run is on $GITHUB_SHA"
            exit 1
          else
            echo "::warning::built $BUILT, but this run is on $GITHUB_SHA: not attesting, the certificate would name the wrong ref"
            echo "sign=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.own.outputs.sign == 'true'
        with:
          path: assets
          merge-multiple: true

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2, holds id-token
        id: attest
        if: steps.own.outputs.sign == 'true'
        with:
          subject-path: assets/liblogosdelivery-*

      # Published beside the libraries, so `gh attestation verify --bundle` works without a login.
      - name: Keep the bundle
        if: steps.own.outputs.sign == 'true'
        run: cp "${{ steps.attest.outputs.bundle-path }}" liblogosdelivery.sigstore.json
      - uses: actions/upload-artifact@v4
        if: steps.own.outputs.sign == 'true'
        with:
          name: liblogosdelivery.sigstore.json
          path: liblogosdelivery.sigstore.json
          if-no-files-found: error

  publish:
    name: publish
    needs: [build, attest]
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Checksums
        working-directory: assets
        run: sha256sum liblogosdelivery-* > SHA256SUMS && cat SHA256SUMS

      - name: Publish the lib-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view lib-latest >/dev/null 2>&1 || gh release create lib-latest \
            --prerelease --title "liblogosdelivery" \
            --notes "Prebuilt liblogosdelivery for \`octopus lib install\`. Built from the logos-delivery commit pinned by the bindings; see SHA256SUMS."
          gh release upload lib-latest assets/* --clobber
