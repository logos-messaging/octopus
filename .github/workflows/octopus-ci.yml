# Octopus CI, as a reusable workflow: team machines run the Linux and macOS legs over
# logos-delivery; whatever no machine takes, and Windows, runs on GitHub-hosted runners.
# The `submit` job is the coordinator: it stays until every leg a team machine took has ended,
# streams its log, reports its result in the job summary and fails if the leg failed. A machine
# that goes silent hands its leg to a hosted runner.
# See docs/decentralized-ci.md. Call it, pinned to a commit:
#
#   jobs:
#     ci:
#       uses: logos-messaging/octopus/.github/workflows/octopus-ci.yml@<sha>
#       permissions: { id-token: write, contents: read }
#
# The pipeline itself is `.octopus/ci.sh` in the calling repo: nodes and the hosted fallback
# both run it.
name: Octopus CI

on:
  workflow_call:
    inputs:
      os:
        description: JSON list of the OSes that team machines may run (linux, macos).
        type: string
        default: '["linux", "macos"]'
      hosted:
        description: JSON list of the OSes that always run on GitHub-hosted runners.
        type: string
        default: '["windows"]'
      wait:
        description: Seconds to wait for an idle team machine to take each leg.
        type: number
        default: 45
      busy-wait:
        description: >-
          Seconds to wait for a busy team machine of an OS to be free before that leg goes to a
          hosted runner. The submit job bills while it waits.
        type: number
        default: 240
      max-run:
        description: >-
          Seconds the submit job waits for a leg a team machine took to end. A leg still running
          then is reported as timed out and fails the job. The hosted job itself ends after 6 h.
        type: number
        default: 5400
      silent-timeout:
        description: >-
          Seconds of silence (no log line, no lease) after which a team machine is taken for lost
          and its leg runs on a hosted runner instead.
        type: number
        default: 90
      team-key:
        description: The team public key. Default is `.octopus/team.pub` of the calling repo.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  submit:
    # Cheap (Linux): it asks the fleet, then stays until the legs taken end (up to `max-run`).
    # It bills while it waits on a private repo; public repos have free minutes.
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      id-token: write
      contents: read
    outputs:
      unhandled: ${{ steps.result.outputs.unhandled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: ref
        # `github.job_workflow_sha` is empty in a reusable workflow; the OIDC token has it.
        continue-on-error: true
        run: |
          sha=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=octopus-ref" | python3 -c '
          import base64, json, sys
          payload = json.load(sys.stdin)["value"].split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
          print(claims["job_workflow_sha"])
          ')
          # A commit, never a ref that can move.
          echo "$sha" | grep -Eq '^[0-9a-f]{40}$'
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - id: submit
        # Any failure here (no library, no network, no fleet) must end in the fallback.
        continue-on-error: true
        env:
          OCTOPUS_REF: ${{ steps.ref.outputs.sha }}
          INPUT_OS: ${{ inputs.os }}
          INPUT_HOSTED: ${{ inputs.hosted }}
          INPUT_WAIT: ${{ inputs.wait }}
          INPUT_BUSY_WAIT: ${{ inputs.busy-wait }}
          INPUT_MAX_RUN: ${{ inputs.max-run }}
          INPUT_SILENT: ${{ inputs.silent-timeout }}
          INPUT_TEAM_KEY: ${{ inputs.team-key }}
        run: |
          test -n "$OCTOPUS_REF"
          pip install "octopus[logos] @ https://github.com/logos-messaging/octopus/archive/${OCTOPUS_REF}.tar.gz"
          octopus lib install
          team_key="${INPUT_TEAM_KEY:-$(cat .octopus/team.pub)}"
          args=()
          for os in $(echo "$INPUT_OS" | python -c 'import json,sys; print(*json.load(sys.stdin))'); do
            args+=(--os "$os")
          done
          # only shown in the summary: the hosted legs run in their own job
          for os in $(echo "$INPUT_HOSTED" | python -c 'import json,sys; print(*json.load(sys.stdin))'); do
            args+=(--hosted "$os")
          done
          octopus ci submit "${args[@]}" --team-key "$team_key" --wait "$INPUT_WAIT" \
            --busy-wait "$INPUT_BUSY_WAIT" --follow --max-run "$INPUT_MAX_RUN" \
            --silent-timeout "$INPUT_SILENT"
      - id: result
        if: always()
        env:
          SUBMITTED: ${{ steps.submit.outputs.unhandled }}
          INPUT_OS: ${{ inputs.os }}
        run: |
          # Nothing reported: everything falls back.
          echo "unhandled=${SUBMITTED:-$INPUT_OS}" >> "$GITHUB_OUTPUT"
      - name: A leg on a team machine failed
        # The submit job is the check that gates: it fails when a leg a team machine ran failed.
        if: always() && steps.submit.outputs.failed != '' && steps.submit.outputs.failed != '[]'
        env:
          FAILED: ${{ steps.submit.outputs.failed }}
        run: |
          echo "::error::failed on a team machine: $FAILED (the log above has its output)"
          exit 1

  fallback:
    # The legs no team machine took.
    needs: submit
    # Also when submit failed because a team leg failed: the other legs still need their runs.
    if: ${{ !cancelled() && needs.submit.outputs.unhandled != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.submit.outputs.unhandled) }}
    runs-on: ${{ fromJSON('{"linux":"ubuntu-latest","macos":"macos-latest"}')[matrix.os] }}
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: bash .octopus/ci.sh

  hosted:
    # Always on GitHub-hosted runners.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.hosted) }}
    runs-on: ${{ fromJSON('{"linux":"ubuntu-latest","macos":"macos-latest","windows":"windows-latest"}')[matrix.os] }}
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: bash .octopus/ci.sh
