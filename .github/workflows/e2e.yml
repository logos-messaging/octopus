name: E2E nightly

# Runs a coordinator and a runner on this machine against a real GitHub repo (docs/e2e.md).
# It needs the repository variable OCTOPUS_E2E_REPO and the secret OCTOPUS_E2E_TOKEN.
# Without the variable, the job does not run.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# Two runs at the same time use the same e2e repo and webhook, so they must not overlap.
concurrency:
  group: e2e-nightly
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  e2e:
    if: vars.OCTOPUS_E2E_REPO != ''
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      E2E_DATA: ${{ github.workspace }}/../octopus-e2e-data
      E2E_LOGS: ${{ github.workspace }}/../octopus-e2e-logs
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: ./.github/actions/liblogosdelivery

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev,logos]'

      # The verified actions/runner release, so that each run does not download it again.
      - uses: actions/cache@v4
        with:
          path: ${{ env.E2E_DATA }}/runner
          key: actions-runner-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/octopus/agent/runner/release.py') }}

      - name: End-to-end test
        env:
          OCTOPUS_E2E_REPO: ${{ vars.OCTOPUS_E2E_REPO }}
          OCTOPUS_E2E_TOKEN: ${{ secrets.OCTOPUS_E2E_TOKEN }}
          OCTOPUS_E2E_REQUIRED: "1"
          OCTOPUS_E2E_DATA_DIR: ${{ env.E2E_DATA }}
          OCTOPUS_E2E_ARTIFACTS: ${{ env.E2E_LOGS }}
        run: pytest -m e2e -v -rs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-logs
          path: ${{ env.E2E_LOGS }}
          if-no-files-found: ignore

      # One open issue collects the failures. A new failure adds a comment to it.
      - name: Report the failure in an issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="E2E nightly failed"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n1)
          body="The nightly end-to-end test failed: $RUN_URL"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --label testing --body "$body"
          fi
