name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      - run: ruff check .

  # Unit tests (everything not marked needs_lib) on all three OSes.
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - { os: macos-latest, python: "3.10" }
          - { os: macos-latest, python: "3.14" }
          - { os: windows-latest, python: "3.10" }
          - { os: windows-latest, python: "3.14" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      - run: pytest

  # Builds liblogosdelivery from the logos-delivery commit pinned by the bindings
  # and runs the needs_lib tests against it. Windows is not covered: the bindings
  # only load lib/liblogosdelivery.so.
  lib:
    name: needs_lib (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # logos-delivery marks its own submodules update=none, so init only this one.
      - name: Checkout the pinned logos-delivery
        working-directory: vendor/logos-delivery-python-bindings
        run: git submodule update --init --checkout vendor/logos-delivery

      - name: Pinned logos-delivery commit
        id: pin
        working-directory: vendor/logos-delivery-python-bindings
        run: echo "sha=$(git rev-parse HEAD:vendor/logos-delivery)" >> "$GITHUB_OUTPUT"

      - name: Restore the built library
        id: libcache
        uses: actions/cache@v4
        with:
          path: |
            vendor/logos-delivery-python-bindings/vendor/logos-delivery/build/liblogosdelivery.so
            vendor/logos-delivery-python-bindings/vendor/logos-delivery/build/liblogosdelivery.dylib
          key: liblogosdelivery-${{ runner.os }}-${{ runner.arch }}-${{ steps.pin.outputs.sha }}

      # Only the long part (Nim, nimble deps, compile) is skipped on a cache hit.
      - name: Build liblogosdelivery
        if: steps.libcache.outputs.cache-hit != 'true'
        working-directory: vendor/logos-delivery-python-bindings/vendor/logos-delivery
        run: |
          make build-deps
          make DISABLE_RLN=true liblogosdelivery

      - name: Install the library where the bindings load it
        working-directory: vendor/logos-delivery-python-bindings
        run: |
          mkdir -p lib
          for f in vendor/logos-delivery/build/liblogosdelivery.so vendor/logos-delivery/build/liblogosdelivery.dylib; do
            if [ -f "$f" ]; then cp "$f" lib/; fi
          done
          if [ -f lib/liblogosdelivery.dylib ]; then ln -sf liblogosdelivery.dylib lib/liblogosdelivery.so; fi
          ls -l lib

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev,logos]'
      - run: pytest -m needs_lib
