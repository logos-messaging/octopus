[project]
name = "octopus"
version = "0.0.1"
description = "Lend your laptop as a GitHub Actions runner for trusted team PRs, coordinated over logos-delivery"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
dependencies = [
  "pydantic>=2.6",
  "typer>=0.12",
  "httpx>=0.27",
  "cryptography>=42",
]

[project.optional-dependencies]
# Needed only by octopus.transport.logos. The bindings themselves live in
# vendor/logos-delivery-python-bindings and load lib/liblogosdelivery.so from
# their checkout, so they are put on the path at runtime, not installed.
logos = ["cffi>=1.16.0", "cbor2>=6.1.4", "result>=0.17.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
octopus = "octopus.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["needs_lib: requires a built liblogosdelivery (see README)"]
addopts = "-m 'not needs_lib'"

[tool.ruff]
line-length = 100
