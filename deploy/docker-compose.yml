# Coordinator + TLS proxy (+ Prometheus with `--profile monitoring`).
#
#   cp deploy/coordinator.env.example deploy/coordinator.env   # fill it in, chmod 600
#   cp /path/to/app-key.pem deploy/app-key.pem                  # App mode: also set
#       OCTOPUS_GITHUB_APP_KEY_FILE=/run/secrets/app-key in coordinator.env
#   touch deploy/app-key.pem                                    # token mode (empty placeholder)
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Run from the repository root, with submodules checked out (see deploy/Dockerfile).
services:
  coordinator:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: octopus-coordinator
    restart: unless-stopped
    env_file: coordinator.env
    secrets:
      - source: app-key
    volumes:
      - coordinator-data:/var/lib/octopus
    ports:
      # The libp2p node must be reachable from the internet; TCP and UDP (QUIC).
      - "60000:60000/tcp"
      - "60000:60000/udp"
      # Webhook and ops stay on the host's loopback: Caddy and Prometheus reach them over the
      # compose network, an operator over SSH.
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9100:9100"
    stop_grace_period: 30s

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [coordinator]
    environment:
      OCTOPUS_DOMAIN: ${OCTOPUS_DOMAIN:?set OCTOPUS_DOMAIN to the public host name}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    ports:
      - "80:80"
      - "443:443"

  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: [monitoring]
    restart: unless-stopped
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

secrets:
  app-key:
    file: ./app-key.pem

volumes:
  coordinator-data:
  caddy-data:
  prometheus-data:
